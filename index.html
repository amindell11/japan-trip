<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan Trip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="list">
  <header>
    <div class="header-row">
      <div class="brand">
        <img src="logo.png" alt="Japan Trip logo" class="site-logo" />
        <h1 class="site-title">Japan Trip</h1>
      </div>
      <div class="tabs">
        <button class="tab" data-view="list">List</button>
        <button class="tab" data-view="map">Map</button>
      </div>
      <div id="auth-slot" class="auth-slot"></div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main>
    <div id="list-view"></div>
    <div id="map-view">
      <div id="filter-bar"></div>
      <div id="map"></div>
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
